<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio IYC — tableau de bord</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --sage: #6d8b74; --ink: #1c1c1c; --line: #e4e4e4; --paper: #f6f5f2; }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body { margin: 0; font-family: Lato, sans-serif; color: var(--ink); background: var(--paper); }
        button, input, textarea, select { font: inherit; }
        button { cursor: pointer; }
        h1, h2, h3 { font-family: Montserrat, sans-serif; font-weight: 600; }
        .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .card { background: #fff; border: 1px solid var(--line); padding: 28px; width: min(420px, 100%); }
        .card h1 { margin-top: 0; }
        label { display: block; font-size: 0.85rem; margin: 14px 0 6px; }
        input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); background: #fff; }
        textarea { min-height: 90px; resize: vertical; }
        .primary { background: var(--sage); color: #fff; border: 0; padding: 12px 16px; }
        .ghost { background: #fff; border: 1px solid var(--line); padding: 8px 12px; }
        .danger { background: #fff; color: #8a2b2b; border: 1px solid #e5c7c7; padding: 8px 12px; }
        .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
        aside { background: #fff; border-right: 1px solid var(--line); padding: 22px 16px; }
        aside button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 8px; }
        aside button.active { background: #eef3ef; color: var(--sage); }
        main { padding: 28px; }
        .row { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
        .list { display: grid; gap: 10px; margin-top: 18px; }
        .item { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--line); padding: 10px; }
        .item img { width: 72px; height: 72px; object-fit: cover; }
        .editor { display: grid; grid-template-columns: 1fr 280px; gap: 22px; align-items: start; }
        .block { background: #fff; border: 1px solid var(--line); padding: 12px; margin-bottom: 10px; }
        .block.dragging { opacity: 0.4; }
        .block.drag-over { outline: 2px solid var(--sage); }
        .block-head { cursor: grab; user-select: none; }
        .block-head:active { cursor: grabbing; }
        .block-add { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
        .block-photo { width: 100%; max-height: 240px; object-fit: contain; background: #f3f3f3; margin: 8px 0; }
        .gallery-edit { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 8px 0; }
        .gallery-edit .thumb { cursor: grab; background: #fff; border: 1px solid var(--line); padding: 6px; }
        .gallery-edit .thumb.drag-over { outline: 2px solid var(--sage); }
        .gallery-edit img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; pointer-events: none; }
        .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
        .photos button, .library button { padding: 0; border: 2px solid transparent; background: #fff; position: relative; }
        .photos img, .library img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
        .photos button.cover, .photo-tile.cover .photo-main { border-color: var(--sage); }
        .photo-tile { position: relative; cursor: grab; }
        .photo-tile.dragging { opacity: 0.35; }
        .photo-tile.drag-over { outline: 2px solid var(--sage); outline-offset: 2px; }
        .photo-tile img { pointer-events: none; }
        .photo-x { position: absolute; top: 4px; right: 4px; z-index: 1; width: 22px; height: 22px; border: 0; border-radius: 50%; background: #1c1c1c; color: #fff; line-height: 1; font-size: 16px; }
        .cover-frame { position: relative; height: 240px; overflow: hidden; background: #1c1c1c; cursor: grab; touch-action: none; user-select: none; margin-bottom: 8px; }
        .cover-frame.dragging { cursor: grabbing; }
        .cover-frame img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
        .cover-caption { position: absolute; left: 16px; right: 16px; bottom: 14px; margin: 0; font-family: Montserrat, sans-serif; font-weight: 600; font-size: 1.35rem; line-height: 1.15; pointer-events: none; }
        .cover-caption.light { color: #fff; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45); }
        .cover-caption.dark { color: #111; text-shadow: 0 2px 12px rgba(255, 255, 255, 0.65); }
        .color-choice { display: flex; gap: 8px; }
        .color-choice button { width: auto; padding: 8px 14px; border: 1px solid var(--line); background: #fff; }
        .color-choice button.active { border-color: var(--ink); background: var(--ink); color: #fff; }
        .library { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; max-height: 420px; overflow: auto; }
        .library button.blocked { opacity: 0.35; cursor: not-allowed; }
        .tag { position: absolute; left: 4px; bottom: 4px; background: #111; color: #fff; font-size: 10px; padding: 2px 4px; }
        .error { color: #8a2b2b; }
        .hint { color: #666; font-size: 0.9rem; }
        @media (max-width: 900px) {
            .app, .editor { grid-template-columns: 1fr; }
            aside { display: flex; gap: 8px; overflow: auto; }
            aside button { width: auto; }
        }
    </style>
</head>
<body>
    <div id="login" class="login">
        <form class="card" id="loginForm">
            <p class="hint">IYC Studio</p>
            <h1>Tableau de bord</h1>
            <label for="password">Mot de passe</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <p id="loginError" class="error"></p>
            <button class="primary" type="submit">Entrer</button>
        </form>
    </div>
    <div id="app" class="app" hidden>
        <aside>
            <strong>IYC Studio</strong>
            <button type="button" data-view="projects" class="active">Projets</button>
            <button type="button" data-view="galleries">Galeries clients</button>
            <button type="button" data-view="posts">Articles</button>
            <button type="button" data-view="password">Mot de passe</button>
            <button type="button" id="logout">Sortir</button>
        </aside>
        <main id="main"></main>
    </div>
    <script>
        const state = { view: "projects", projects: [], posts: [], galleries: [], library: [], editing: null };

        async function api(url, options) {
            const response = await fetch(url, { headers: { "Content-Type": "application/json" }, ...options });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "Erreur");
            return data;
        }

        async function fileToDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function upload(file) {
            const dataUrl = await fileToDataUrl(file);
            const saved = await api("/api/upload", { method: "POST", body: JSON.stringify({ name: file.name, dataUrl }) });
            await load();
            return saved.src;
        }

        async function load() {
            const data = await api("/api/content");
            state.projects = data.projects;
            state.posts = data.posts;
            state.galleries = data.galleries || [];
            state.library = data.library;
            if (state.editing && state.editing.id && state.view === "galleries") {
                const fresh = state.galleries.find((gallery) => gallery.id === state.editing.id);
                if (fresh) state.editing = { ...fresh, reveal: state.editing.reveal || null };
            }
            render();
        }

        function syncEditingForm() {
            const form = document.getElementById("editor");
            const editing = state.editing;
            if (!form || !editing || !Array.isArray(editing.blocks) || !form.elements.title) return;
            editing.title = form.elements.title.value;
            editing.date = form.elements.date.value;
            editing.dateLabel = form.elements.dateLabel.value;
            editing.minutes = form.elements.minutes.value;
            editing.excerpt = form.elements.excerpt.value;
        }

        function render() {
            syncEditingForm();
            const main = document.getElementById("main");
            if (state.view === "password") return renderPassword(main);
            if (state.view === "posts") return state.editing ? renderPostEditor(main) : renderPosts(main);
            if (state.view === "galleries") return state.editing ? renderGalleryEditor(main) : renderGalleries(main);
            return state.editing ? renderProjectEditor(main) : renderProjects(main);
        }

        function renderProjects(main) {
            main.innerHTML = `<div class="row"><h1>Projets</h1><button class="primary" id="newProject">Nouveau projet</button></div>
                <p class="hint">Chaque projet est une série. Les photos déjà utilisées dans le blog sont bloquées.</p>
                <div class="list">${state.projects.map((project) => `<article class="item">
                    <img src="/${project.cover}" alt="">
                    <div><strong>${escapeHtml(project.title)}</strong><div class="hint">${escapeHtml(project.category)} · ${project.photos.length} photos</div></div>
                    <button class="ghost" data-edit="${project.id}">Modifier</button>
                </article>`).join("")}</div>`;
            document.getElementById("newProject").onclick = () => { state.editing = blankProject(); render(); };
            main.querySelectorAll("[data-edit]").forEach((button) => button.onclick = () => {
                state.editing = structuredClone(state.projects.find((project) => project.id === button.dataset.edit));
                render();
            });
        }

        function renderPosts(main) {
            main.innerHTML = `<div class="row"><h1>Articles</h1><button class="primary" id="newPost">Nouvel article</button></div>
                <div class="list">${state.posts.map((post) => `<article class="item">
                    <img src="/${post.cover || "images/fichier-1-300x-AoPvowXDj1U242O6.png"}" alt="">
                    <div><strong>${escapeHtml(post.title)}</strong><div class="hint">${escapeHtml(post.dateLabel || post.date)}</div></div>
                    <button class="ghost" data-edit="${post.id}">Modifier</button>
                </article>`).join("")}</div>`;
            document.getElementById("newPost").onclick = () => { state.editing = blankPost(); render(); };
            main.querySelectorAll("[data-edit]").forEach((button) => button.onclick = () => {
                state.editing = structuredClone(state.posts.find((post) => post.id === button.dataset.edit));
                render();
            });
        }

        function renderProjectEditor(main) {
            const project = state.editing;
            main.innerHTML = `<div class="row"><h1>${project.id ? "Modifier le projet" : "Nouveau projet"}</h1><button class="ghost" id="back">Retour</button></div>
                <p id="formError" class="error"></p>
                <div class="editor">
                    <form id="editor">
                        <label>Titre</label><input name="title" value="${escapeAttr(project.title)}" required>
                        <label>Univers</label><input name="category" value="${escapeAttr(project.category)}" placeholder="Mariage, Portrait, Événement…">
                        <label>Lieu</label><input name="location" value="${escapeAttr(project.location)}">
                        <label>Année</label><input name="year" value="${escapeAttr(project.year)}">
                        <label>Phrase d'accroche</label><input name="excerpt" value="${escapeAttr(project.excerpt)}">
                        <label>Présentation du projet</label><textarea name="story">${escapeHtml((project.story || []).join("\n\n"))}</textarea>
                        <label>Photo de couverture</label>
                        <div class="cover-frame" id="coverFrame"><img id="coverImage" alt="" draggable="false"><p class="cover-caption" id="coverCaption"></p></div>
                        <p class="hint">Glisse la photo dans le cadre pour la monter ou la descendre, comme une couverture Facebook.</p>
                        <label>Couleur du texte sur la photo</label>
                        <div class="color-choice" id="textColor">
                            <button type="button" data-color="white">Blanc</button>
                            <button type="button" data-color="black">Noir</button>
                        </div>
                        <label>Photos du projet</label>
                        <input id="addPhotos" type="file" accept="image/*" multiple hidden>
                        <div class="photos" id="photoList"></div>
                        <p class="hint">Glisse les photos pour les classer. Clique une photo pour la couverture. La croix la retire du projet. Le + en ajoute.</p>
                        <div class="row" style="margin-top:16px">
                            <button class="primary" type="submit">Enregistrer</button>
                            ${project.id ? '<button class="danger" type="button" id="remove">Supprimer le projet entier</button>' : ""}
                        </div>
                    </form>
                    <aside>
                        <button class="primary" type="button" id="importPhotos" style="margin-bottom:14px">Importer depuis mon PC</button>
                        <label>Photos déjà importées</label>
                        <p class="hint">Clique une photo pour l'ajouter au projet. Celles du blog restent bloquées.</p>
                        <div class="library" id="library"></div>
                    </aside>
                </div>`;
            document.getElementById("back").onclick = () => { state.editing = null; render(); };
            document.getElementById("importPhotos").onclick = () => document.getElementById("addPhotos").click();
            document.getElementById("addPhotos").onchange = async (event) => {
                for (const file of event.target.files) {
                    const src = await upload(file);
                    if (!project.photos.includes(src)) project.photos.push(src);
                    if (!project.cover) project.cover = src;
                }
                event.target.value = "";
                render();
            };
            drawProjectPhotos();
            bindTextColor();
            document.getElementById("editor").onsubmit = async (event) => {
                event.preventDefault();
                const data = Object.fromEntries(new FormData(event.target));
                data.story = data.story.split(/\n{2,}/);
                data.photos = project.photos;
                data.cover = project.cover;
                data.coverPosition = project.coverPosition || "50% 50%";
                data.textColor = project.textColor === "black" ? "black" : "white";
                data.slug = project.slug;
                try {
                    if (project.id) await api("/api/projects/" + project.id, { method: "PUT", body: JSON.stringify(data) });
                    else await api("/api/projects", { method: "POST", body: JSON.stringify(data) });
                    state.editing = null;
                    await load();
                } catch (error) {
                    document.getElementById("formError").textContent = error.message;
                }
            };
            const remove = document.getElementById("remove");
            if (remove) remove.onclick = async () => {
                if (!confirm("Supprimer tout le projet « " + project.title + " » ? Cette action retire le projet du site. Les photos restent dans la bibliothèque.")) return;
                await api("/api/projects/" + project.id, { method: "DELETE" });
                state.editing = null;
                await load();
            };
        }

        function drawProjectPhotos() {
            const project = state.editing;
            document.getElementById("photoList").innerHTML = project.photos.map((src, index) => `<div class="photo-tile ${src === project.cover ? "cover" : ""}" data-index="${index}">
                <button type="button" class="photo-main" draggable="true" data-index="${index}" aria-label="Choisir comme couverture"><img src="/${src}" alt="" draggable="false"></button>
                <button type="button" class="photo-x" data-remove="${index}" aria-label="Retirer cette photo">×</button>
            </div>`).join("") + `<button type="button" class="photo-add" id="addPhoto" aria-label="Ajouter des photos">+</button>`;
            document.getElementById("photoList").querySelectorAll(".photo-main").forEach((button) => {
                const tile = button.parentElement;
                button.ondragstart = (event) => {
                    button.dataset.dragged = "1";
                    tile.classList.add("dragging");
                    event.dataTransfer.effectAllowed = "move";
                    event.dataTransfer.setData("text/plain", button.dataset.index);
                };
                button.ondragend = () => tile.classList.remove("dragging");
                tile.ondragover = (event) => {
                    event.preventDefault();
                    tile.classList.add("drag-over");
                };
                tile.ondragleave = () => tile.classList.remove("drag-over");
                tile.ondrop = (event) => {
                    event.preventDefault();
                    const from = Number(event.dataTransfer.getData("text/plain"));
                    const to = Number(tile.dataset.index);
                    if (Number.isNaN(from) || from === to) return;
                    const [moved] = project.photos.splice(from, 1);
                    project.photos.splice(to, 0, moved);
                    drawProjectPhotos();
                };
                button.onclick = () => {
                    if (button.dataset.dragged === "1") {
                        button.dataset.dragged = "";
                        return;
                    }
                    const src = project.photos[Number(button.dataset.index)];
                    if (project.cover !== src) project.coverPosition = "50% 50%";
                    project.cover = src;
                    drawProjectPhotos();
                };
            });
            document.getElementById("photoList").querySelectorAll(".photo-x").forEach((button) => {
                button.onclick = () => {
                    const [removed] = project.photos.splice(Number(button.dataset.remove), 1);
                    if (project.cover === removed) {
                        project.cover = project.photos[0] || "";
                        project.coverPosition = "50% 50%";
                    }
                    drawProjectPhotos();
                };
            });
            document.getElementById("addPhoto").onclick = () => document.getElementById("addPhotos").click();
            drawCoverFrame();
            drawLibrary();
        }

        function bindTextColor() {
            const project = state.editing;
            project.textColor = project.textColor === "black" ? "black" : "white";
            const box = document.getElementById("textColor");
            const titleInput = document.querySelector('#editor [name="title"]');
            const sync = () => {
                box.querySelectorAll("button").forEach((button) => {
                    button.classList.toggle("active", button.dataset.color === project.textColor);
                });
                const caption = document.getElementById("coverCaption");
                if (!caption) return;
                caption.textContent = (titleInput && titleInput.value.trim()) || "Titre";
                caption.className = "cover-caption " + (project.textColor === "black" ? "dark" : "light");
            };
            box.querySelectorAll("button").forEach((button) => {
                button.onclick = () => {
                    project.textColor = button.dataset.color;
                    sync();
                };
            });
            if (titleInput) titleInput.addEventListener("input", sync);
            sync();
        }

        function drawCoverFrame() {
            const project = state.editing;
            const frame = document.getElementById("coverFrame");
            const image = document.getElementById("coverImage");
            if (!frame || !image) return;
            project.coverPosition = project.coverPosition || "50% 50%";
            if (!project.cover) {
                image.style.display = "none";
                return;
            }
            image.style.display = "block";
            image.src = "/" + project.cover;
            image.style.objectPosition = project.coverPosition;
            if (frame.dataset.bound) return;
            frame.dataset.bound = "1";
            let drag = null;
            frame.onpointerdown = (event) => {
                if (!project.cover) return;
                const parts = (project.coverPosition || "50% 50%").split(" ");
                drag = { x: event.clientX, y: event.clientY, posX: parseFloat(parts[0]), posY: parseFloat(parts[1]) };
                frame.classList.add("dragging");
                frame.setPointerCapture(event.pointerId);
            };
            frame.onpointermove = (event) => {
                if (!drag) return;
                const posX = Math.min(100, Math.max(0, drag.posX - ((event.clientX - drag.x) / frame.clientWidth) * 100));
                const posY = Math.min(100, Math.max(0, drag.posY - ((event.clientY - drag.y) / frame.clientHeight) * 100));
                project.coverPosition = `${Math.round(posX)}% ${Math.round(posY)}%`;
                image.style.objectPosition = project.coverPosition;
            };
            const stop = () => {
                drag = null;
                frame.classList.remove("dragging");
            };
            frame.onpointerup = stop;
            frame.onpointercancel = stop;
        }

        function drawLibrary() {
            const project = state.editing;
            document.getElementById("library").innerHTML = state.library.map((file) => {
                const blocked = file.blog;
                const selected = project.photos.includes(file.src);
                return `<button type="button" class="${blocked ? "blocked" : ""}" data-src="${file.src}" ${blocked ? "disabled" : ""}>
                    <img src="/${file.src}" alt="">
                    ${blocked ? '<span class="tag">Blog</span>' : selected ? '<span class="tag">Ajoutée</span>' : ""}
                </button>`;
            }).join("");
            document.getElementById("library").querySelectorAll("button:not(.blocked)").forEach((button) => {
                button.onclick = () => {
                    const src = button.dataset.src;
                    if (!project.photos.includes(src)) project.photos.push(src);
                    if (!project.cover) project.cover = src;
                    drawProjectPhotos();
                };
            });
        }

        function renderPostEditor(main) {
            const post = state.editing;
            post.blocks = post.blocks || [];
            main.innerHTML = `<div class="row"><h1>${post.id ? "Modifier l'article" : "Nouvel article"}</h1><button class="ghost" id="back">Retour</button></div>
                <p id="formError" class="error"></p>
                <form id="editor">
                    <label>Titre</label><input name="title" value="${escapeAttr(post.title)}" required>
                    <label>Date</label><input name="date" type="date" value="${escapeAttr(post.date)}">
                    <label>Date affichée</label><input name="dateLabel" value="${escapeAttr(post.dateLabel)}">
                    <label>Minutes de lecture</label><input name="minutes" value="${escapeAttr(post.minutes)}">
                    <label>Résumé</label><textarea name="excerpt">${escapeHtml(post.excerpt)}</textarea>
                    <label>Image de couverture</label>
                    <input id="coverFile" type="file" accept="image/*">
                    ${post.cover ? `<img src="/${post.cover}" alt="" style="width:180px;height:120px;object-fit:cover">` : ""}
                    <h2>Contenu</h2>
                    <p class="hint">Glisse un bloc par sa barre du haut pour le déplacer, par exemple pour échanger deux photos. Clique Enregistrer pour mettre l'article à jour.</p>
                    <div id="blocks"></div>
                    <div class="block-add">
                        <button class="ghost" type="button" id="addHeading">+ Titre</button>
                        <button class="ghost" type="button" id="addSubheading">+ Sous-titre</button>
                        <button class="ghost" type="button" id="addText">+ Paragraphe</button>
                        <button class="ghost" type="button" id="addHtml">+ Texte avec lien</button>
                        <button class="ghost" type="button" id="addImage">+ Photo</button>
                        <button class="ghost" type="button" id="addGallery">+ Groupe de photos</button>
                        <button class="ghost" type="button" id="addList">+ Liste</button>
                        <button class="ghost" type="button" id="addButton">+ Bouton</button>
                    </div>
                    <div class="row" style="margin-top:16px">
                        <button class="primary" type="submit">Enregistrer</button>
                        ${post.id ? '<button class="danger" type="button" id="remove">Supprimer</button>' : ""}
                    </div>
                </form>`;
            document.getElementById("back").onclick = () => { state.editing = null; render(); };
            document.getElementById("coverFile").onchange = async (event) => {
                post.cover = await upload(event.target.files[0]);
                render();
            };
            const mount = document.getElementById("blocks");
            post.blocks.forEach((block, index) => mount.append(blockNode(post, block, index)));
            document.getElementById("addText").onclick = () => { post.blocks.push({ type: "paragraph", text: "" }); render(); };
            document.getElementById("addHeading").onclick = () => { post.blocks.push({ type: "heading", level: 2, text: "" }); render(); };
            document.getElementById("addSubheading").onclick = () => { post.blocks.push({ type: "heading", level: 3, text: "" }); render(); };
            document.getElementById("addHtml").onclick = () => { post.blocks.push({ type: "html", html: "" }); render(); };
            document.getElementById("addImage").onclick = () => { post.blocks.push({ type: "image", src: "", alt: "", caption: "" }); render(); };
            document.getElementById("addGallery").onclick = () => { post.blocks.push({ type: "gallery", images: [] }); render(); };
            document.getElementById("addList").onclick = () => { post.blocks.push({ type: "list", items: [""] }); render(); };
            document.getElementById("addButton").onclick = () => { post.blocks.push({ type: "button", label: "", href: "" }); render(); };
            document.getElementById("editor").onsubmit = async (event) => {
                event.preventDefault();
                const data = Object.fromEntries(new FormData(event.target));
                data.blocks = post.blocks;
                data.cover = post.cover;
                data.slug = post.slug;
                try {
                    if (post.id) await api("/api/posts/" + encodeURIComponent(post.id), { method: "PUT", body: JSON.stringify(data) });
                    else await api("/api/posts", { method: "POST", body: JSON.stringify(data) });
                    state.editing = null;
                    await load();
                } catch (error) {
                    document.getElementById("formError").textContent = error.message;
                }
            };
            const remove = document.getElementById("remove");
            if (remove) remove.onclick = async () => {
                if (!confirm("Supprimer cet article ?")) return;
                await api("/api/posts/" + encodeURIComponent(post.id), { method: "DELETE" });
                state.editing = null;
                await load();
            };
        }

        function blockNode(post, block, index) {
            const wrap = document.createElement("div");
            wrap.className = "block";
            const controls = `<div class="row block-head" data-drag draggable="true"><strong>${labelOf(block)}</strong><span>
                <button class="ghost" type="button" data-up>Monter</button>
                <button class="ghost" type="button" data-down>Descendre</button>
                <button class="danger" type="button" data-del>Retirer</button></span></div>`;
            wrap.innerHTML = controls + fieldsOf(block);
            const handle = wrap.querySelector("[data-drag]");
            handle.ondragstart = (event) => {
                if (event.target.closest("button")) {
                    event.preventDefault();
                    return;
                }
                wrap.classList.add("dragging");
                event.dataTransfer.effectAllowed = "move";
                event.dataTransfer.setData("text/plain", "block:" + index);
            };
            handle.ondragend = () => wrap.classList.remove("dragging");
            wrap.ondragover = (event) => {
                event.preventDefault();
                wrap.classList.add("drag-over");
            };
            wrap.ondragleave = (event) => {
                if (!wrap.contains(event.relatedTarget)) wrap.classList.remove("drag-over");
            };
            wrap.ondrop = (event) => {
                const raw = event.dataTransfer.getData("text/plain");
                wrap.classList.remove("drag-over");
                if (!raw.startsWith("block:")) return;
                event.preventDefault();
                const from = Number(raw.slice(6));
                if (Number.isNaN(from) || from === index) return;
                const [moved] = post.blocks.splice(from, 1);
                post.blocks.splice(index, 0, moved);
                render();
            };
            wrap.querySelector("[data-up]").onclick = () => { if (index > 0) { swap(post.blocks, index, index - 1); render(); } };
            wrap.querySelector("[data-down]").onclick = () => { if (index < post.blocks.length - 1) { swap(post.blocks, index, index + 1); render(); } };
            wrap.querySelector("[data-del]").onclick = () => { post.blocks.splice(index, 1); render(); };
            wrap.querySelectorAll("[data-field]").forEach((field) => {
                if (field.dataset.field === "items") return;
                field.oninput = () => {
                    block[field.dataset.field] = field.dataset.field === "level" ? Number(field.value) : field.value;
                };
            });
            const file = wrap.querySelector("[data-file]");
            if (file) file.onchange = async (event) => {
                block.src = await upload(event.target.files[0]);
                if (!block.alt) block.alt = block.caption || "";
                render();
            };
            const galleryFiles = wrap.querySelector("[data-gallery-files]");
            if (galleryFiles) galleryFiles.onchange = async (event) => {
                block.images = block.images || [];
                for (const item of event.target.files) {
                    block.images.push({ src: await upload(item), alt: "" });
                }
                render();
            };
            wrap.querySelectorAll("[data-gallery-remove]").forEach((button) => {
                button.onclick = () => {
                    block.images.splice(Number(button.dataset.galleryRemove), 1);
                    render();
                };
            });
            wrap.querySelectorAll(".thumb").forEach((thumb) => {
                thumb.ondragstart = (event) => {
                    event.stopPropagation();
                    thumb.classList.add("dragging");
                    event.dataTransfer.effectAllowed = "move";
                    event.dataTransfer.setData("text/plain", "photo:" + thumb.dataset.photoIndex);
                };
                thumb.ondragend = () => thumb.classList.remove("dragging");
                thumb.ondragover = (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    thumb.classList.add("drag-over");
                };
                thumb.ondragleave = () => thumb.classList.remove("drag-over");
                thumb.ondrop = (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    const raw = event.dataTransfer.getData("text/plain");
                    if (!raw.startsWith("photo:")) return;
                    const from = Number(raw.slice(6));
                    const to = Number(thumb.dataset.photoIndex);
                    if (Number.isNaN(from) || from === to) return;
                    const [moved] = block.images.splice(from, 1);
                    block.images.splice(to, 0, moved);
                    render();
                };
            });
            return wrap;
        }

        function fieldsOf(block) {
            if (block.type === "paragraph") return `<textarea data-field="text" placeholder="Le paragraphe">${escapeHtml(block.text || "")}</textarea>`;
            if (block.type === "heading") {
                const level = Number(block.level) === 3 ? 3 : 2;
                return `<select data-field="level"><option value="2" ${level === 2 ? "selected" : ""}>Grand titre</option><option value="3" ${level === 3 ? "selected" : ""}>Sous-titre</option></select><input data-field="text" value="${escapeAttr(block.text || "")}" placeholder="Le titre">`;
            }
            if (block.type === "html") return `<textarea data-field="html" placeholder="Texte, avec un lien si besoin : &lt;a href=&quot;https://...&quot;&gt;voir&lt;/a&gt;">${escapeHtml(block.html || "")}</textarea>`;
            if (block.type === "button") return `<input data-field="label" placeholder="Texte du bouton" value="${escapeAttr(block.label || "")}"><input data-field="href" placeholder="Adresse du lien" value="${escapeAttr(block.href || "")}">`;
            if (block.type === "list") return `<textarea data-field="items" placeholder="Une ligne par élément">${escapeHtml((block.items || []).join("\n"))}</textarea>`;
            if (block.type === "image") return `${block.src ? `<img class="block-photo" src="/${block.src}" alt="">` : `<p class="hint">Choisis une photo.</p>`}<input data-file type="file" accept="image/*"><input data-field="caption" placeholder="Légende" value="${escapeAttr(block.caption || "")}"><input data-field="alt" placeholder="Description de la photo" value="${escapeAttr(block.alt || "")}">`;
            if (block.type === "gallery") {
                const images = (block.images || []).map((image) => typeof image === "string" ? { src: image, alt: "" } : { src: image.src || "", alt: image.alt || "" });
                block.images = images;
                const thumbs = images.map((image, imageIndex) => `<div class="thumb" data-photo-index="${imageIndex}" draggable="true"><img src="/${image.src}" alt=""><button class="danger" type="button" data-gallery-remove="${imageIndex}">Retirer</button></div>`).join("");
                return `<div class="gallery-edit">${thumbs}</div><input data-gallery-files type="file" accept="image/*" multiple><p class="hint">Glisse les photos de ce groupe pour les classer.</p>`;
            }
            return "";
        }

        function labelOf(block) {
            if (block.type === "heading") return Number(block.level) === 3 ? "Sous-titre" : "Titre";
            return { paragraph: "Paragraphe", image: "Photo", gallery: "Groupe de photos", list: "Liste", html: "Texte avec lien", button: "Bouton" }[block.type] || block.type;
        }

        function renderGalleries(main) {
            main.innerHTML = `<div class="row"><h1>Galeries clients</h1><button class="primary" id="newGallery">Nouvelle galerie</button></div>
                <p class="hint">Tu enregistres l'e-mail du client, puis tu lui envoies le lien, le code et le mot de passe. Rien ne part tout seul.</p>
                <div class="list">${state.galleries.map((gallery) => `<article class="item">
                    <img src="${gallery.photos[0] ? `/api/galleries/${gallery.id}/photos/${gallery.photos[0].id}` : "/images/fichier-1-300x-AoPvowXDj1U242O6.png"}" alt="">
                    <div><strong>${escapeHtml(gallery.clientName)}</strong><div class="hint">${escapeHtml(gallery.email || "sans e-mail")} · ${escapeHtml(gallery.code)} · ${gallery.photos.length} photos${gallery.selection.submittedAt ? " · sélection reçue" : ""}</div></div>
                    <button class="ghost" data-edit="${gallery.id}">Ouvrir</button>
                </article>`).join("") || `<p class="hint">Aucune galerie pour l'instant.</p>`}</div>`;
            document.getElementById("newGallery").onclick = () => {
                state.editing = { clientName: "", email: "", code: "", date: new Date().toISOString().slice(0, 10), maxPhotos: 10, photos: [], selection: { photoIds: [], submittedAt: null } };
                render();
            };
            main.querySelectorAll("[data-edit]").forEach((button) => button.onclick = () => {
                state.editing = structuredClone(state.galleries.find((gallery) => gallery.id === button.dataset.edit));
                render();
            });
        }

        function renderGalleryEditor(main) {
            const gallery = state.editing;
            const link = gallery.code ? `${location.origin}/client-gallery.html?code=${encodeURIComponent(gallery.code)}` : "";
            const chosen = gallery.photos.filter((photo) => photo.selected).map((photo) => photo.filename);
            main.innerHTML = `<div class="row"><h1>${gallery.id ? "Galerie de " + escapeHtml(gallery.clientName) : "Nouvelle galerie"}</h1><button class="ghost" id="back">Retour</button></div>
                <p id="formError" class="error"></p>
                ${gallery.reveal ? `<div class="block"><strong>À envoyer au client</strong><p>Code : ${escapeHtml(gallery.reveal.code)}</p><p>Mot de passe : ${escapeHtml(gallery.reveal.password)}</p><p class="hint">Ce mot de passe ne s'affichera plus ensuite.</p><p><a href="${escapeAttr(gallery.reveal.link)}">${escapeHtml(gallery.reveal.link)}</a></p>${gallery.reveal.mailHref ? `<p><a class="primary" style="display:inline-block;padding:12px 16px;text-decoration:none" href="${escapeAttr(gallery.reveal.mailHref)}">Ouvrir l'e-mail pour ${escapeHtml(gallery.reveal.email)}</a></p>` : `<p class="hint">Ajoute son e-mail pour préparer le message.</p>`}</div>` : ""}
                <form id="editor">
                    <label>Nom du client</label><input name="clientName" value="${escapeAttr(gallery.clientName)}" required>
                    <label>E-mail du client</label><input name="email" type="email" value="${escapeAttr(gallery.email || "")}" placeholder="marie@email.com">
                    <label>Code d'accès</label><input name="code" value="${escapeAttr(gallery.code)}" placeholder="ex. marie-mariage">
                    <label>Date de la séance</label><input name="date" type="date" value="${escapeAttr(gallery.date)}">
                    <label>Nombre de photos qu'il peut choisir</label><input name="maxPhotos" type="number" min="1" max="500" value="${gallery.maxPhotos || 10}">
                    <label>${gallery.id ? "Nouveau mot de passe (laisser vide pour garder l'actuel)" : "Mot de passe du client"}</label>
                    <input name="password" type="text" minlength="${gallery.id ? 0 : 6}" autocomplete="off" placeholder="${gallery.id ? "Inchangé si vide" : "6 caractères minimum"}">
                    <label>Ajouter des photos</label><input id="galleryFiles" type="file" accept="image/*" multiple>
                    <p id="uploadStatus" class="hint"></p>
                    <button class="primary" type="submit">Enregistrer</button>
                </form>
                ${link ? `<p class="hint">Lien du client : <a href="${escapeAttr(link)}">${escapeHtml(link)}</a></p>` : ""}
                ${gallery.selection && gallery.selection.submittedAt ? `<div class="block"><strong>Sélection validée</strong><p class="hint">${new Date(gallery.selection.submittedAt).toLocaleString("fr-FR")}</p><p>${chosen.map(escapeHtml).join("<br>") || "Aucune photo"}</p></div>` : `<p class="hint">Le client n'a pas encore validé sa sélection.</p>`}
                <div class="photos">${gallery.photos.map((photo) => `<div class="block">
                    <img src="/api/galleries/${gallery.id}/photos/${photo.id}" alt="" style="width:100%;aspect-ratio:1;object-fit:cover">
                    <p class="hint">${escapeHtml(photo.filename)}${photo.selected ? " · choisie" : ""}</p>
                    <button class="danger" type="button" data-photo="${photo.id}">Retirer</button>
                </div>`).join("")}</div>
                ${gallery.id ? `<button class="danger" id="deleteGallery" type="button">Supprimer la galerie</button>` : ""}`;
            document.getElementById("back").onclick = () => { state.editing = null; render(); };
            main.querySelectorAll("[data-photo]").forEach((button) => button.onclick = async () => {
                state.editing = await api(`/api/galleries/${gallery.id}/photos/${button.dataset.photo}`, { method: "DELETE" });
                render();
            });
            const remove = document.getElementById("deleteGallery");
            if (remove) remove.onclick = async () => {
                if (!confirm("Supprimer cette galerie et ses photos ?")) return;
                await api("/api/galleries/" + gallery.id, { method: "DELETE" });
                state.editing = null;
                await load();
            };
            document.getElementById("editor").onsubmit = async (event) => {
                event.preventDefault();
                const form = event.target;
                const error = document.getElementById("formError");
                error.textContent = "";
                const payload = {
                    clientName: form.clientName.value,
                    email: form.email.value,
                    code: form.code.value,
                    date: form.date.value,
                    maxPhotos: Number(form.maxPhotos.value),
                };
                if (form.password.value) payload.password = form.password.value;
                try {
                    document.getElementById("uploadStatus").textContent = "Enregistrement…";
                    const currentId = state.editing.id;
                    let saved = await api(currentId ? "/api/galleries/" + currentId : "/api/galleries", {
                        method: currentId ? "PUT" : "POST",
                        body: JSON.stringify(payload),
                    });
                    state.editing.id = saved.id;
                    const files = [...form.galleryFiles.files];
                    for (let index = 0; index < files.length; index += 1) {
                        document.getElementById("uploadStatus").textContent = `Photo ${index + 1} / ${files.length}`;
                        const dataUrl = await fileToDataUrl(files[index]);
                        saved = await api(`/api/galleries/${saved.id}/photos`, {
                            method: "POST",
                            body: JSON.stringify({ name: files[index].name, dataUrl }),
                        });
                    }
                    state.editing = saved;
                    if (payload.password) {
                        const link = `${location.origin}/client-gallery.html?code=${encodeURIComponent(saved.code)}`;
                        const message = `Bonjour,\n\nVos photos sont en ligne.\n\nLien : ${link}\nCode d'accès : ${saved.code}\nMot de passe : ${payload.password}\n\nJimmy — IYC Studio`;
                        state.editing.reveal = {
                            code: saved.code,
                            password: payload.password,
                            email: saved.email || "",
                            link,
                            mailHref: saved.email ? `mailto:${saved.email}?subject=${encodeURIComponent("Vos photos — IYC Studio")}&body=${encodeURIComponent(message)}` : "",
                        };
                    }
                    await load();
                } catch (err) {
                    error.textContent = err.message;
                    const status = document.getElementById("uploadStatus");
                    if (status) status.textContent = "";
                }
            };
        }

        function renderPassword(main) {
            main.innerHTML = `<h1>Mot de passe</h1>
                <form id="pass" class="card">
                    <label>Mot de passe actuel</label><input name="current" type="password" required>
                    <label>Nouveau mot de passe</label><input name="next" type="password" minlength="8" required>
                    <p id="passMsg"></p>
                    <button class="primary" type="submit">Changer</button>
                </form>`;
            document.getElementById("pass").onsubmit = async (event) => {
                event.preventDefault();
                const data = Object.fromEntries(new FormData(event.target));
                try {
                    await api("/api/password", { method: "POST", body: JSON.stringify(data) });
                    document.getElementById("passMsg").textContent = "Mot de passe mis à jour.";
                } catch (error) {
                    document.getElementById("passMsg").textContent = error.message;
                }
            };
        }

        function blankProject() {
            return { title: "", category: "Portrait", location: "Bordeaux", year: "", excerpt: "", story: [], cover: "", photos: [] };
        }
        function blankPost() {
            const today = new Date().toISOString().slice(0, 10);
            return { title: "", date: today, dateLabel: "", minutes: "4", excerpt: "", cover: "", blocks: [{ type: "paragraph", text: "" }] };
        }
        function swap(list, a, b) { [list[a], list[b]] = [list[b], list[a]]; }
        function escapeHtml(value) { return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
        function escapeAttr(value) { return escapeHtml(value).replace(/"/g, "&quot;"); }

        document.getElementById("loginForm").onsubmit = async (event) => {
            event.preventDefault();
            try {
                await api("/api/login", { method: "POST", body: JSON.stringify({ password: document.getElementById("password").value }) });
                document.getElementById("login").hidden = true;
                document.getElementById("app").hidden = false;
                await load();
            } catch (error) {
                document.getElementById("loginError").textContent = error.message;
            }
        };
        document.querySelectorAll("aside button[data-view]").forEach((button) => button.onclick = () => {
            state.view = button.dataset.view;
            state.editing = null;
            document.querySelectorAll("aside button").forEach((item) => item.classList.remove("active"));
            button.classList.add("active");
            render();
        });
        document.getElementById("logout").onclick = async () => { await api("/api/logout", { method: "POST", body: "{}" }); location.reload(); };

        api("/api/me").then((data) => { if (data.ok) { document.getElementById("login").hidden = true; document.getElementById("app").hidden = false; load(); } });

        const originalListHandler = null;
        document.addEventListener("input", (event) => {
            if (event.target.dataset.field === "items" && state.editing && state.editing.blocks) {
                const block = event.target.closest(".block");
                const index = [...block.parentNode.children].indexOf(block);
                state.editing.blocks[index].items = event.target.value.split("\n").map((line) => line.trim()).filter(Boolean);
            }
        });
    </script>
</body>
</html>
